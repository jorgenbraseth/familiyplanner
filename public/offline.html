<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3FA34D">
<title>Frakoblet – Familieplanlegger</title>
<style>
  :root { color-scheme: light dark; --bg: #fbf8ef; --surface: #fffdf7; --line: #ede4cf; --ink: #3b3226; --heading: #6d597a; --primary: #3fa34d; --on-primary: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1b16; --surface: #2a261f; --line: #3a342a; --ink: #f1ebdd; --heading: #c9b6d6; --primary: #5bbe68; --on-primary: #10210f; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; text-align: center; }
  main { max-width: 22rem; background: var(--surface); border: 2px solid var(--line); border-radius: 1.25rem; padding: 1.5rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; color: var(--heading); }
  p { margin: 0 0 1.25rem; line-height: 1.5; }
  button { min-height: 44px; padding: 0 1.5rem; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Du er frakoblet</h1>
  <p>Familieplanleggeren trenger internett. Sjekk tilkoblingen og prøv igjen.</p>
  <button type="button" onclick="location.reload()">Prøv igjen</button>
</main>
</body>
</html>
